[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atomo-bohr"
version = "0.1.0"
description = "Librería didáctica en Python para resolver y graficar el modelo del átomo de Bohr en átomos hidrogenoides."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Luder Espitia Guzmán"}
]
keywords = ["física", "mecánica cuántica", "átomo de Bohr", "espectroscopía", "hidrogenoide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics"
]
dependencies = [
    "numpy>=1.24.0"
]

[project.optional-dependencies]
gui = [
    "matplotlib>=3.7.0",
    "streamlit>=1.28.0"
]
dev = [
    "pytest>=7.4.0",
    "build>=1.0.0",
    "twine>=4.0.0",
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]